# AdamW + inverse-LR schedule for the BS-Locoformer separator.

optimizer:
  _partial_: true
  _target_: torch.optim.AdamW
  betas:
  - 0.8
  - 0.99
  lr: 0.0001
  weight_decay: 0.001
scheduler:
  _partial_: true
  _target_: utils.scheduler.InverseLR
  inv_gamma: 100000
  power: 1.0
  warmup: 0.9995
